name: oddstar-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package and test dependencies
        run: |
          python -m pip install -e ".[dev]"
      - name: Run offline test suite
        run: |
          pytest -v
      - name: Run governance and schema checks (R4, R6, R7, AGENTS.md)
        run: |
          python -m oddstar.ci_checks
